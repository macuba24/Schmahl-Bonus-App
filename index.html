<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff6600">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Schmahl">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Kundenkarte Schmahl</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body data-eingang="kunde">
  <main>
    <header class="top">
      <div class="logo-band">
        <button type="button" id="logo-button" class="logo-button" aria-label="Schmahl GmbH">
          <img id="logo" class="logo" alt="" src="logo.png" hidden>
          <span id="wordmark" class="wordmark">Schmahl</span>
        </button>
      </div>
      <p class="role">Kundenkarte</p>
    </header>
    <nav class="switch" aria-label="Eingang">
      <button type="button" id="tab-kunde" aria-pressed="true">Kunde</button>
      <button type="button" id="tab-kasse" aria-pressed="false">Kasse</button>
    </nav>
    <div class="panels">
      <section id="kunde" aria-label="Kunde">
        <h2>Kunde</h2>
        <p>Einen Moment.</p>
      </section>
      <section id="kasse" aria-label="Kasse">
        <h2>Kasse</h2>
      </section>
    </div>
    <div id="shop-lines" class="shop-lines"></div>
    <div id="laden-qr" class="laden-qr"></div>
    <p class="hint"><a href="prospekt.html">Prospekt mit dem Ladezeichen</a></p>
  </main>
  <script src="vendor/qrcode.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
